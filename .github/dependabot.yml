version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Plugins declare these as peer dependencies (preact by 42 plugins, vfile by 15), so a
    # major bump here passes `npm ci` but breaks plugins at runtime (#2586). Upgrade them
    # deliberately, together with the plugins.
    ignore:
      - dependency-name: "preact"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vfile"
        update-types: ["version-update:semver-major"]
      - dependency-name: "unified"
        update-types: ["version-update:semver-major"]
    groups:
      # Separated so a risky third-party major cannot block ecosystem updates.
      quartz-ecosystem:
        applies-to: "version-updates"
        patterns:
          - "@quartz-community/*"
          - "@quartz-themes/*"
      # Isolated because a compiler major needs a tsconfig migration of its own.
      typescript:
        applies-to: "version-updates"
        patterns:
          - "typescript"
      production-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
        exclude-patterns:
          - "@quartz-community/*"
          - "@quartz-themes/*"
          - "typescript"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ci-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
