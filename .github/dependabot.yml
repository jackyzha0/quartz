version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Separated so a risky third-party major cannot block ecosystem updates.
      quartz-ecosystem:
        applies-to: "version-updates"
        patterns:
          - "@quartz-community/*"
          - "@quartz-themes/*"
      production-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
        exclude-patterns:
          - "@quartz-community/*"
          - "@quartz-themes/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ci-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
