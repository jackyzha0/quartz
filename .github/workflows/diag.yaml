# ══════════════════════════════════════════════════════════════════════
#  Diagnostic moteur : exécute scripts/diag.ts (bundle du moteur + tests)
#  et publie le résultat dans l'issue « Diagnostic moteur — runTurn ».
#  Temporaire — à supprimer une fois le bug corrigé.
# ══════════════════════════════════════════════════════════════════════
name: Diagnostic moteur (diag.ts)
on:
  push:
    branches:
      - chasse-et-peche-web
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chasse-et-peche-web
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run diag.ts
        run: node --experimental-strip-types scripts/diag.ts > diag-out.txt 2>&1 || true
      - name: Publier le résultat dans l'issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs")
            const out = fs.readFileSync("diag-out.txt", "utf8").slice(0, 55000)
            const TITLE = "Diagnostic moteur — runTurn / armées (résultats)"
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            })
            let issue = issues.data.find((i) => i.title === TITLE)
            const body = "Run " + context.runId + " — commit " + context.sha + "\n\n```\n" + out + "\n```\n"
            if (issue) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body })
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: TITLE, body })
            }
