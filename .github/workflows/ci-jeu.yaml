# ═══════════════════════════════════════════════════════════════════════════
#  CI JEU — Chasse & Pêche (branche chasse-et-peche-web + v4)
#  Typecheck strict + tests moteur/fusion/banque + bundle Edge Function
#  + test d'exécution du bundle (celui que Deno chargera).
#  Sans cette CI, les tests ne tournaient NULLE PART (le workflow du
#  site quartz lance ses propres tests, pas ceux du jeu).
# ═══════════════════════════════════════════════════════════════════════════
name: CI jeu

# Ne tourne QUE sur la branche du jeu : sur v4, le package.json et le
#  tsconfig à la racine sont ceux du SITE quartz (jsx preact, deps
#  différentes) — typechecker src/ du jeu dans cet environnement
#  produit des centaines de faux positifs.
on:
  push:
    branches: [chasse-et-peche-web]
  pull_request:
    branches: [chasse-et-peche-web]

jobs:
  jeu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck strict
        run: npx tsc --noEmit
      - name: Tests (moteur, fusion multijoueur, banque d'effets)
        run: npm test
      - name: Bundle Edge Function (esbuild — résout extensions + JSON)
        run: npm run build:function
      - name: Typecheck Edge Function (tsc + stubs)
        # BUG 2026-10-19 : `cfgMondiale` utilisé sans être défini dans
        #   resoudre-tour/index.ts est parti en PRODUCTION vert — les
        #   tests couvrent le bundle moteur (_engine.mjs), jamais le
        #   handler lui-même, et le tsconfig du jeu n'inclut pas
        #   supabase/functions/. Check strict dédié (stubs jsr: et
        #   _engine.mjs dans types/stubs.d.ts) : vérifié en local en
        #   régression sur le bug historique (TS2304 « Cannot find
        #   name 'cfgMondiale' »). NB : un `deno check` complet échoue
        #   en CI (il tente d'installer les dépendances npm
        #   transitives de supabase-js hors package-lock).
        run: npx tsc -p supabase/functions/resoudre-tour/tsconfig.check.json
      - name: Test d'exécution du bundle (comme Deno le chargera)
        run: npm run test:function
      - name: Build du jeu (tsc + vite)
        run: npm run build
