<!-- Auto-resize Cusdis comment iframe to full height -->
<script>
(function() {
  var thread = document.getElementById('cusdis_thread');
  if (!thread) return;
  var observer = new MutationObserver(function() {
    var iframe = thread.querySelector('iframe');
    if (iframe) {
      iframe.style.minHeight = '400px';
      iframe.style.overflow = 'hidden';
      iframe.scrolling = 'no';
      iframe.setAttribute('scrolling', 'no');
      // Listen for Cusdis resize messages
      window.addEventListener('message', function(e) {
        if (e.data && e.data.from === 'cusdis') {
          var h = parseInt(e.data.body.height, 10);
          if (h > 0) iframe.style.height = (h + 50) + 'px';
        }
      });
      // Poll for content height changes as fallback
      setInterval(function() {
        try {
          var body = iframe.contentDocument || iframe.contentWindow.document;
          if (body && body.body) {
            var h = body.body.scrollHeight;
            if (h > 0) iframe.style.height = (h + 50) + 'px';
          }
        } catch(e) {}
      }, 1000);
      observer.disconnect();
    }
  });
  observer.observe(thread, { childList: true, subtree: true });
})();
</script>

<!-- Reading progress bar (only on single post pages) -->
<div id="reading-progress"></div>
<script>
(function() {
  var bar = document.getElementById('reading-progress');
  if (!bar || !document.querySelector('.article-meta')) return;
  window.addEventListener('scroll', function() {
    var docHeight = document.documentElement.scrollHeight - window.innerHeight;
    if (docHeight > 0) {
      bar.style.width = (window.scrollY / docHeight * 100) + '%';
    }
  });
})();
</script>
