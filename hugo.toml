baseURL = "https://bineshkumar.me/notes/"
languageCode = "en-us"
title = "The Data Sense"
theme = "hugo-xmin"

[markup]
  [markup.highlight]
    noClasses = true
    style = "github"
    guessSyntax = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$']]
          inline = [['$', '$']]

[params]
  description = "PhD Research on Medical Vision-Language Model Robustness"

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1
